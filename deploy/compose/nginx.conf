server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-domain API proxy — homepad-api serves everything under /api. In prod
  # the Pangolin/K8s Ingress does this routing (so the image's own nginx.conf
  # deliberately omits it); the docker-compose stack has no ingress, so the web
  # container proxies /api itself. This mirrors the homepad-web-nginx ConfigMap
  # in the platform repo — `api` is the compose service name, :8080 its port.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # SPA fallback — every unknown path returns index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets, no-cache the index.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # nginx's bundled mime.types has no .webmanifest entry, so the file otherwise
  # falls back to application/octet-stream, which blocks PWA install (#18/#69).
  # `types { }` clears the inherited mime map for THIS location only, then
  # default_type supplies the manifest type.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
  }
}
