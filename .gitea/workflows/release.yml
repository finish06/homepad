name: Release
# Merge -> staging -> Gracie-QA release path, delegated to the shared composite.
# Unit tests (ci.yml `web`) and the #35 browser gate (browser-gate.yml) stay put
# as required checks; this workflow owns only build+publish+deploy+QA-dispatch.
on:
  push:
    branches: [main]

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Reference ci-shared by its FULL in-cluster Gitea URL. A bare
      # `uses: Code/ci-shared@v1` resolves against github.com on this runner and
      # 404s — the in-cluster host clones it without a Pangolin trip. (verified)
      - uses: http://gitea-http.gitea.svc.cluster.local:3000/Code/ci-shared@v1
        with:
          image-name: homepad
          staging-url: https://homepad-staging.10.17.2.213.nip.io
          deploy-cmd: |
            printf '%s' "$KUBECONFIG_STAGING" > /tmp/kc && export KUBECONFIG=/tmp/kc
            # catthehacker runner image ships no kubectl — install the pinned binary.
            if ! command -v kubectl >/dev/null 2>&1; then
              curl -sSLf -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.30.2/bin/linux/amd64/kubectl
              chmod +x /usr/local/bin/kubectl
            fi
            kubectl -n homepad-staging set image deploy/homepad-web web="$IMAGE_REF"
            kubectl -n homepad-staging rollout status deploy/homepad-web --timeout=120s
        env:
          REGISTRY_USERNAME:  ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD:  ${{ secrets.REGISTRY_PASSWORD }}
          NATS_PUBLISH_URL:   ${{ secrets.NATS_PUBLISH_URL }}
          NATS_PUBLISH_TOKEN: ${{ secrets.NATS_PUBLISH_TOKEN }}
          KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}
