# Standardized PR-gate via Code/ci-shared/mr-staging@v3 (CI/CD fleet rollout).
#
# Migrates homepad off the old monolithic `ci-shared@v2` (which built + deployed +
# QA'd only AFTER merge, in release.yml) to the split @v3 model: QA now runs at
# PR time and gates the merge.
#
# On a pull_request to main: build the candidate image homepad:<sha>-test
# (unit + browser gates run once in ci.yml / browser-gate.yml — see test-cmd),
# push it, deploy it to this PR's own preview environment (SPEC-preview-environments:
# namespace homepad-preview, objects labelled pr=<n>, at
# http://pr-<n>.homepad-preview.<cluster-domain>), then dispatch QA to the
# docker-claude qa-runner via ci-shared's dispatch-qa.sh (QA_BACKEND=docker-claude).
# PRs no longer touch homepad-staging; that stays "what's on main"
# (staging-release.yml). preview-teardown.yml removes the preview on close. On a
# PASS the QA runner approves + merges this PR via the Gitea API; main is
# branch-protected (required_approvals=1, approvals whitelist ci-docs-approver,
# qa-claude) so the merge only lands behind the QA gate.
#
# ci.yml (Web build+unit, API vet+tests) and browser-gate.yml (#35) stay as
# separate required status checks.
#
# Two images, ONE mr-staging step (SPEC-monorepo-api AC-012): a second step
# would dispatch QA a second time, and the two QA runs would race. The action
# builds the web image every time, because qa-gate checks the preview's
# /version.json against the PR head sha, and only the web serves it. The API
# image is built only when the PR touches api/: scripts/preview/api-image.sh
# builds homepad-api:<sha>-test inside deploy-cmd with ci-shared's own
# build-push.sh, or else reads main's API from homepad-staging (AC-013).
name: PR -> staging gate

on:
  pull_request:
    branches: [main]

# One preview deploy per PR at a time; a newer push cancels the older run.
# Two pushes 0s apart started runs 7069 and 7071 for PR #632, and the one that
# failed tore down the preview the other had just deployed (#632). Gitea honours
# workflow-level `concurrency` with cancel-in-progress since 1.26.0 (go-gitea/gitea#32751);
# the deploy's failure trap also checks ownership (teardown-if-owner.sh), in
# case a cancelled run still reaches it.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mr-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: http://gitea-http.gitea.svc.cluster.local:3000/Code/ci-shared/mr-staging@v3
        with:
          image-name: homepad
          # This PR's preview (Code/homelab apps/homepad/preview/README.md).
          staging-url: http://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
          qa-backend: ${{ vars.QA_BACKEND || 'nats' }}
          # qa-gate logs in through the API (the runner supplies QA_EMAIL /
          # QA_PASSWORD). Same preview host as staging-url above. Needs a
          # ci-shared @v3 that declares this input (ci-shared#46); an older @v3
          # just drops it.
          qa-login-url: http://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}/api/login
          # A gated code review runs before qa-gate; a blocking (or failed)
          # review skips QA, so nothing auto-merges. Needs a ci-shared @v3 that
          # declares this input (ci-shared#49); an older @v3 just drops it.
          code-review: 'true'
          # Test-dedup: the unit suite is NOT re-run here. ci.yml ("Web (build,
          # unit tests)") and browser-gate.yml are required status checks on
          # this same PR head sha — branch protection already blocks the QA
          # bot's merge if they fail, so a third `npm ci && npm run build &&
          # npm test` (~3 min) bought nothing. Kaniko's image build below
          # still compiles the app (its `npm run build` includes tsc), and the
          # preview deploy + QA pool remain this workflow's actual gate: the
          # e2e/browser level, which runs only here.
          #
          # NOTE: the composite splices this string into a shell double-quoted
          # test ( if [ -n "<test-cmd>" ] ), so it must contain no quotes,
          # parentheses, semicolons, backticks, or $ — a punctuated echo here
          # broke the detect step with a bash syntax error (run 5436).
          test-cmd: |
            echo skipping duplicate unit suite - ci.yml and browser-gate.yml already gate this sha
          deploy-cmd: |
            # Per-PR preview (SPEC-preview-environments §7; cluster contract in
            # Code/homelab apps/homepad/preview/README.md): fetch the four
            # templates, render them for this PR, apply, wait for db/api/web,
            # then seed the fresh Postgres (#623) so qa-gate can log in.
            #
            # A failure anywhere from the apply to the seed tears this PR's
            # preview down before the step goes red (AC-007). Without that, a
            # refused 4th preview leaves its Services/ConfigMap/IngressRoute
            # behind, and a broken rollout keeps holding one of the 3 slots.
            # It tears down only what THIS run deployed (#632): if the web
            # Deployment carries another run's stamp, that run owns the preview
            # and it stays (scripts/preview/teardown-if-owner.sh). A fetch or
            # render failure applied nothing, so it deletes nothing.
            #
            # Kubeconfig lands 0600 (default umask leaves /tmp/kc world-readable
            # for the rest of the job otherwise) and is removed after the deploy.
            # Cleanup runs on EVERY exit path, success or failure (#503): `rm -f`
            # lines at the end are skipped by `bash -e` the moment any command
            # before them fails, and /tmp/kc is cluster credentials.
            #
            # `rc=$?; set +e; …; exit $rc` is deliberate, not decoration. Under
            # `bash -e`, errexit stays ACTIVE inside an EXIT trap, so a failing
            # cleanup command would abort the trap with status 1 — turning a
            # successful deploy red, which is the #502 failure mode again. Capturing
            # the status and switching errexit off first means cleanup can never
            # change the outcome.
            # The preview domain is the PREVIEW_DOMAIN repo variable (kept out of
            # the public mirror, #680). Unset, it would deploy a preview nobody
            # can reach, so stop before anything touches the cluster.
            if [ -z "$PREVIEW_DOMAIN" ]; then
              echo "::error::PREVIEW_DOMAIN repo variable is not set"; exit 1
            fi
            WORK="$(mktemp -d)"
            stage=setup
            cleanup() {
              rc=$?; set +e
              if [ "$rc" -ne 0 ] && [ "$stage" != setup ]; then
                echo "::error::Preview deploy for PR #$PR_NUMBER failed at '$stage' (exit $rc)."
                if [ "$stage" = apply ] && grep -q 'exceeded quota' "$WORK/apply.log"; then
                  echo "::error::3 previews already running; merge or close one, then re-run this job."
                fi
                case "$stage" in
                  apply|rollout|seed) bash scripts/preview/teardown-if-owner.sh ;;
                esac
              fi
              rm -rf "$WORK"; rm -f /tmp/kc
              exit $rc
            }
            trap cleanup EXIT
            install -m 600 /dev/null /tmp/kc
            printf '%s' "$KUBECONFIG_PREVIEW" > /tmp/kc && export KUBECONFIG=/tmp/kc
            # catthehacker runner image ships no kubectl — install the pinned
            # binary and verify the sha256 (pinned from kubectl.sha256 at pin
            # time, NOT fetched alongside the binary) before executing it with
            # cluster credentials in scope.
            if ! command -v kubectl >/dev/null 2>&1; then
              curl -sSLf -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.34.13/bin/linux/amd64/kubectl
              echo "b4bb494e9466a7a94bb851414548bc0d3e2f8da90757e6eccc3371e648648591  /usr/local/bin/kubectl" | sha256sum -c -
              chmod +x /usr/local/bin/kubectl
            fi
            # ...nor envsubst, which scripts/preview/render.sh needs.
            bash scripts/preview/install-envsubst.sh
            # (a) Fetch the templates. Download to files, NO pipes, deliberately:
            # ci-shared runs deploy-cmd under `bash -e -o pipefail`, and a reader
            # that quits early (`curl ... | sed '/^---$/q'`) made curl exit 23
            # AFTER a successful apply, failing the job intermittently (#499-#501).
            # Any HTTP status but 200 fails here and names the file.
            stage=fetch
            # #578: an empty or missing read token gets the same 404 as a moved
            # file. Say which secret is missing instead.
            : "${GITEA_READ_TOKEN:?HOMELAB_READ_TOKEN secret not set}"
            HOMELAB_RAW=http://gitea-http.gitea.svc.cluster.local:3000/Code/homelab/raw/branch/main
            mkdir "$WORK/templates" "$WORK/out"
            for f in 01-db 02-api 03-web 04-ingress; do
              path=apps/homepad/preview/template/$f.yaml
              code=$(curl -sS -H "Authorization: token $GITEA_READ_TOKEN" \
                -o "$WORK/templates/$f.yaml" -w '%{http_code}' "$HOMELAB_RAW/$path")
              if [ "$code" != 200 ]; then
                echo "homelab template fetch failed: HTTP $code for $path" >&2
                exit 1
              fi
            done
            # (b) The API image: this PR's own homepad-api:<sha>-test if it
            # touches api/, built here with the script the action built the web
            # with; otherwise whatever main's staging runs (the preview SA may
            # read exactly that one field). SPEC-monorepo-api AC-013.
            stage=api-image
            BUILD_PUSH="${GITHUB_ACTION_PATH:-}/../scripts/build-push.sh"
            if [ ! -f "$BUILD_PUSH" ]; then
              echo "::error::ci-shared's build-push.sh not found at '$BUILD_PUSH' (GITHUB_ACTION_PATH='${GITHUB_ACTION_PATH:-}')" >&2
              exit 1
            fi
            export BUILD_PUSH
            API_IMAGE=$(bash scripts/preview/api-image.sh)
            # (c) Render and apply. DEPLOYED_AT is stamped on EVERY deploy: the
            # 48h preview-janitor keys on it, so it stays pure RFC3339. Two runs
            # can stamp the same second (#632), so PREVIEW_RUN (env, run id +
            # attempt) goes on as homepad.preview/run and names the owner for
            # the failure trap.
            # Assign, then export: `export X=$(cmd)` would hide cmd's failure.
            stage=render
            DEPLOYED_AT=$(date -u +%FT%TZ)
            export DEPLOYED_AT API_IMAGE
            bash scripts/preview/render.sh "$WORK/templates" "$WORK/out"
            # A 4th concurrent preview is refused HERE (count/deployments.apps
            # quota): kubectl exits 1 and pipefail carries it through tee.
            stage=apply
            kubectl apply -f "$WORK/out" 2>&1 | tee "$WORK/apply.log"
            # (d) An update push rolls web in place; the db pod template carries
            # no per-deploy field, so its emptyDir survives (AC-009).
            stage=rollout
            for app in db api web; do
              kubectl -n homepad-preview rollout status "deploy/homepad-$app-pr-$PR_NUMBER" --timeout=120s
            done
            for app in api web; do
              echo "::notice::homepad-$app-pr-$PR_NUMBER runs $(kubectl -n homepad-preview get deploy "homepad-$app-pr-$PR_NUMBER" -o jsonpath='{.spec.template.spec.containers[0].image}')"
            done
            # (e) Seed (#623): idempotent, so it runs on every deploy. The QA
            # login goes to this command only and is never echoed.
            stage=seed
            PREVIEW_URL="http://pr-$PR_NUMBER.$PREVIEW_DOMAIN"
            bash scripts/seed-qa.sh "$PREVIEW_URL"
            echo "::notice::Preview for PR #$PR_NUMBER: $PREVIEW_URL"
        env:
          REGISTRY_USERNAME:  ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD:  ${{ secrets.REGISTRY_PASSWORD }}
          NATS_PUBLISH_URL:   ${{ secrets.NATS_PUBLISH_URL }}
          NATS_PUBLISH_TOKEN: ${{ secrets.NATS_PUBLISH_TOKEN }}
          QA_TRIGGER_TOKEN:   ${{ secrets.QA_TRIGGER_TOKEN }}
          # Preview deploy (deploy-cmd above). KUBECONFIG_PREVIEW is the
          # homepad-preview ci-deployer SA; HOMELAB_READ_TOKEN reads the
          # templates from Code/homelab; QA_EMAIL / QA_PASSWORD feed the seed.
          KUBECONFIG_PREVIEW: ${{ secrets.KUBECONFIG_PREVIEW }}
          GITEA_READ_TOKEN:   ${{ secrets.HOMELAB_READ_TOKEN }}
          QA_EMAIL:           ${{ secrets.QA_EMAIL }}
          QA_PASSWORD:        ${{ secrets.QA_PASSWORD }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          # Preview host suffix: pr-<n>.<PREVIEW_DOMAIN> (repo Actions variable).
          PREVIEW_DOMAIN:     ${{ vars.PREVIEW_DOMAIN }}
          PR_SHA:             ${{ github.event.pull_request.head.sha }}
          # scripts/preview/api-image.sh diffs the PR from here (did it touch api/?).
          BASE_SHA:           ${{ github.event.pull_request.base.sha }}
          # This run's ownership stamp on the preview (#632). The attempt part
          # keeps a re-run (same run id) distinct.
          PREVIEW_RUN:        ${{ github.run_id }}-${{ github.run_attempt }}
          # The composite's docs-only auto-approve step (as ci-docs-approver)
          # reads its credential from THIS env block; it can't read the secret
          # itself (#616, run 6969: empty token, warn, no approval). Map it so
          # docs-only PRs, which skip QA, still get their approval.
          DOCS_APPROVER_TOKEN: ${{ secrets.DOCS_APPROVER_TOKEN }}
