# Standardized PR-gate via Code/ci-shared/mr-staging@v3 (CI/CD fleet rollout).
#
# Migrates homepad off the old monolithic `ci-shared@v2` (which built + deployed +
# QA'd only AFTER merge, in release.yml) to the split @v3 model: QA now runs at
# PR time and gates the merge.
#
# On a pull_request to main: build the candidate image homepad:<sha>-test
# (unit + browser gates run once in ci.yml / browser-gate.yml — see test-cmd),
# push it, deploy it to staging
# (homepad-staging ns), then dispatch the QA POOL (friend.qa.task.*). On a PASS the
# pool bot approves + merges this PR via the Gitea API with its own PAT; main is
# branch-protected (required_approvals=1, whitelist gracie) so the merge only lands
# behind the QA gate.
#
# ci.yml (Web build+unit) and browser-gate.yml (#35) stay as separate required
# status checks.
name: PR -> staging gate

on:
  pull_request:
    branches: [main]

jobs:
  mr-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: http://gitea-http.gitea.svc.cluster.local:3000/Code/ci-shared/mr-staging@v3
        with:
          image-name: homepad
          staging-url: https://homepad-staging.10.17.2.213.nip.io
          # Test-dedup: the unit suite is NOT re-run here. ci.yml ("Web (build,
          # unit tests)") and browser-gate.yml are required status checks on
          # this same PR head sha — branch protection already blocks the QA
          # bot's merge if they fail, so a third `npm ci && npm run build &&
          # npm test` (~3 min) bought nothing. Kaniko's image build below
          # still compiles the app (its `npm run build` includes tsc), and the
          # staging deploy + QA pool remain this workflow's actual gate: the
          # e2e/browser level, which runs only here.
          #
          # NOTE: the composite splices this string into a shell double-quoted
          # test ( if [ -n "<test-cmd>" ] ), so it must contain no quotes,
          # parentheses, semicolons, backticks, or $ — a punctuated echo here
          # broke the detect step with a bash syntax error (run 5436).
          test-cmd: |
            echo skipping duplicate unit suite - ci.yml and browser-gate.yml already gate this sha
          deploy-cmd: |
            # Kubeconfig lands 0600 (default umask leaves /tmp/kc world-readable
            # for the rest of the job otherwise) and is removed after the rollout.
            install -m 600 /dev/null /tmp/kc
            printf '%s' "$KUBECONFIG_STAGING" > /tmp/kc && export KUBECONFIG=/tmp/kc
            # catthehacker runner image ships no kubectl — install the pinned
            # binary and verify the sha256 (pinned from kubectl.sha256 at pin
            # time, NOT fetched alongside the binary) before executing it with
            # cluster credentials in scope.
            if ! command -v kubectl >/dev/null 2>&1; then
              curl -sSLf -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.30.2/bin/linux/amd64/kubectl
              echo "c6e9c45ce3f82c90663e3c30db3b27c167e8b19d83ed4048b61c1013f6a7c66e  /usr/local/bin/kubectl" | sha256sum -c -
              chmod +x /usr/local/bin/kubectl
            fi
            # Converge the deploy-owned nginx ConfigMap from Code/homelab BEFORE
            # rolling the image. That ConfigMap shadows the image's nginx.conf
            # entirely (issue #414: PR #412's security headers + version.json
            # no-store never reached staging because only the image conf had
            # them). The manifest's FIRST yaml doc is the ConfigMap — apply just
            # that, never the Deployment doc (its image field would fight the
            # set-image below).
            curl -sSf http://gitea-http.gitea.svc.cluster.local:3000/Code/homelab/raw/branch/main/homepad-staging/03-web.yaml \
              | sed '/^---$/q' | kubectl -n homepad-staging apply -f -
            kubectl -n homepad-staging set image deploy/homepad-web web="$IMAGE_REF"
            # Restart even when the image tag is unchanged so a ConfigMap-only
            # change still reaches the pods (mounted configs don't hot-reload).
            kubectl -n homepad-staging rollout restart deploy/homepad-web
            kubectl -n homepad-staging rollout status deploy/homepad-web --timeout=120s
            rm -f /tmp/kc
        env:
          REGISTRY_USERNAME:  ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD:  ${{ secrets.REGISTRY_PASSWORD }}
          NATS_PUBLISH_URL:   ${{ secrets.NATS_PUBLISH_URL }}
          NATS_PUBLISH_TOKEN: ${{ secrets.NATS_PUBLISH_TOKEN }}
          KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}
