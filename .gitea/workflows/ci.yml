name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  web:
    name: Web (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  build-and-push:
    name: Build & push image
    needs: web
    # Only on a merge/push to main — not on PRs or feature branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Short commit SHA
        id: sha
        run: echo "short=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Registry login
        run: docker login dockerhub.calebdunn.tech -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build image
        run: docker build -t dockerhub.calebdunn.tech/homepad:${{ steps.sha.outputs.short }} -t dockerhub.calebdunn.tech/homepad:latest .
      - name: Push image
        run: |
          docker push dockerhub.calebdunn.tech/homepad:${{ steps.sha.outputs.short }}
          docker push dockerhub.calebdunn.tech/homepad:latest
