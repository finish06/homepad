name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  web:
    name: Web (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Unit tests (vitest)
        run: npx vitest run
