# Single source of truth for the unit-level gate (typecheck/build + vitest).
# Runs ONCE per PR head sha, at PR time only.
#
# Test-dedup contract (each suite runs exactly once per change):
#   - commit/push to a feat branch, no PR yet  -> nothing in CI (run locally)
#   - PR opened/updated                        -> THIS workflow (required check)
#                                                 + browser-gate (required check)
#                                                 + mr-staging (image -> staging
#                                                   deploy -> QA pool = e2e gate)
#   - merge to main                            -> staging-release BUILDS ONLY;
#                                                 no re-test (main is branch-
#                                                 protected: the exact tested
#                                                 sha is what merges)
#
# The old `push: [main, feat/**]` trigger ran this same suite on the branch
# push AND the PR event AND again on the merge commit — three runs of one
# suite. pull_request alone covers the only moment a result gates anything.
name: CI

on:
  pull_request:

jobs:
  web:
    name: Web (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # NOTE: package.json has a `lint` script but eslint is not installed and
      # no config exists — wire up eslint (flat config) before gating on it here.
      - run: npm run build
      - run: npx vitest run
