name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  web:
    name: Web (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  # Build & push + staging deploy + Gracie QA now live in release.yml via the
  # Code/ci-shared@v1 composite. (The old in-line build-and-push job was removed
  # when homepad became the first ci-shared adopter.)
