# Standardized post-merge build via Code/ci-shared/staging-release@v3 (fleet rollout).
#
# Replaces the old monolithic release.yml (ci-shared@v2). On push to main (after a
# PR merges through the mr-staging gate + QA pool), build the integrated image
# homepad:<sha>-beta (+ immutable :<sha>) with Kaniko, push it, and roll it to
# staging (homepad-staging ns). No test gate / no re-QA — the PR was already gated
# by mr-staging + the QA pool, and main is branch-protected.
name: main -> staging build

on:
  push:
    branches: [main]

jobs:
  staging-release:
    runs-on: ubuntu-latest
    steps:
      - uses: http://gitea-http.gitea.svc.cluster.local:3000/Code/ci-shared/staging-release@v3
        with:
          image-name: homepad
          deploy-cmd: |
            # 0600 kubeconfig + checksum-verified kubectl — mirrors mr-staging.yml.
            # Cleanup runs on EVERY exit path, success or failure (#503). The two
            # deploy temp files AND /tmp/kc — the staging kubeconfig, i.e. cluster
            # credentials — used to be removed by `rm -f` lines that `bash -e` skips
            # the moment any command before them fails (curl, kubectl apply, or the
            # common one: `rollout status` timing out). The advisory covered the temp
            # files; the kubeconfig had the same failure mode and was the one that
            # mattered.
            #
            # `rc=$?; set +e; …; exit $rc` is deliberate, not decoration. Under
            # `bash -e`, errexit stays ACTIVE inside an EXIT trap, so a failing
            # cleanup command would abort the trap with status 1 — turning a
            # successful deploy red, which is the #502 failure mode again. Capturing
            # the status and switching errexit off first means cleanup can never
            # change the outcome. Verified: success -> 0, failure(7) -> 7,
            # curl-23 -> 23, with a deliberately failing cleanup command.
            WORK="$(mktemp -d)"
            trap 'rc=$?; set +e; rm -rf "$WORK"; rm -f /tmp/kc; exit $rc' EXIT
            install -m 600 /dev/null /tmp/kc
            printf '%s' "$KUBECONFIG_STAGING" > /tmp/kc && export KUBECONFIG=/tmp/kc
            if ! command -v kubectl >/dev/null 2>&1; then
              curl -sSLf -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.30.2/bin/linux/amd64/kubectl
              echo "c6e9c45ce3f82c90663e3c30db3b27c167e8b19d83ed4048b61c1013f6a7c66e  /usr/local/bin/kubectl" | sha256sum -c -
              chmod +x /usr/local/bin/kubectl
            fi
            # Converge the deploy-owned nginx ConfigMap (first yaml doc only —
            # see mr-staging.yml for the full rationale / issue #414).
            #
            # Download, extract, apply — NO pipes. Piping curl into
            # `sed '/^---$/q'` fails intermittently with curl exit 23 under
            # ci-shared's `bash -e -o pipefail`; see mr-staging.yml for the
            # reproduction. This path fires on every merge to main, so the flake
            # was not limited to PRs.
            curl -sSf http://gitea-http.gitea.svc.cluster.local:3000/Code/homelab/raw/branch/main/homepad-staging/03-web.yaml -o "$WORK/manifest.yaml"
            sed '/^---$/q' "$WORK/manifest.yaml" > "$WORK/configmap.yaml"
            kubectl -n homepad-staging apply -f "$WORK/configmap.yaml"
            kubectl -n homepad-staging set image deploy/homepad-web web="$IMAGE_REF"
            kubectl -n homepad-staging rollout restart deploy/homepad-web
            kubectl -n homepad-staging rollout status deploy/homepad-web --timeout=120s
        env:
          REGISTRY_USERNAME:  ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD:  ${{ secrets.REGISTRY_PASSWORD }}
          KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}
