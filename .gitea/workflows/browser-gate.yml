name: Browser gate

# #35 regression gate. A PR that the tile / menu / drag-and-drop suite can see
# must pass a REAL Chromium (Playwright) check — jsdom-green is not enough
# (z-index hit-testing + synthetic-event ordering are invisible to jsdom).
# Kept in its own workflow + job so it can be a *required* status check.
#
# REQUIRED CHECK — DO NOT RENAME THE JOB. Branch protection on main requires the
# context "Browser gate / Browser gate (#35 tile/menu/dnd) (pull_request)",
# which is <workflow name> / <job name> / <event>. Renaming `jobs.browser-gate`'s
# `name:` below stops that context from ever reporting and blocks every PR.
# scripts/ci/workflows.test.sh pins the string.
#
# Path-filtering note: a workflow that simply doesn't trigger on unrelated PRs
# would block them forever waiting for a check that never arrives. Instead this
# job ALWAYS runs on PRs but asks scripts/ci/gate-surfaces.sh whether the PR
# touches a surface the suite pins, and only does the heavy install+build+
# browser-test work when it does — otherwise it passes as a no-op. Either way the
# same check is reported, so it is safe to require.
#
# The trigger covers everything tests/browser-gate/ pins, not just tile/menu/dnd:
# the suite grew header, accounts, CSP, kid-board, widget and backup/import specs
# under the same #35 pattern, and a trigger that names fewer files than the suite
# tests silently skips its own tests. The script fails CLOSED — an unreadable
# diff runs the gate rather than reporting green.
#
# Test-dedup: PR-only. The old extra `push: [main]` trigger re-ran the exact gate
# that had just passed on the PR's head sha — main is branch-protected, so the
# merged tree is the tested tree. One run, at the moment it gates.
on:
  pull_request:

# One gate run per PR at a time; a newer push cancels the older run (#632 taught
# the preview workflow the same lesson). Gitea honours workflow-level
# `concurrency` with cancel-in-progress since 1.26.0 (go-gitea/gitea#32751).
concurrency:
  group: browser-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-gate:
    name: Browser gate (#35 tile/menu/dnd)
    runs-on: ubuntu-latest
    # A hung install or spec must not hold the runner for the default 6 hours.
    timeout-minutes: 25
    # Run inside the Playwright-published image whose tag matches the EXACT
    # @playwright/test version resolved in package-lock.json (1.60.0). It ships
    # the matching Chromium (and all OS deps) preinstalled at ~/.cache/ms-playwright,
    # so we never download ~150MB from cdn.playwright.dev at runtime — that download
    # was timing out (5×30s → "Failed to install browsers") and wedging this gate.
    # A version mismatch here would re-trigger a download, so keep it pinned to the
    # lockfile version; the `Verify the container image` step below fails with the
    # exact fix when they drift. The image bundles git + node, so checkout/setup work.
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Cheap, runs on every PR: it guards the gate itself, not the PR's diff.
      # A Playwright bump in package-lock.json without a matching container tag
      # would otherwise only show up as a slow, flaky run.
      - name: Verify the container image matches the lockfile
        run: bash scripts/ci/playwright-image.sh

      - name: Detect browser-gate surfaces
        id: filter
        run: bash scripts/ci/gate-surfaces.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        if: steps.filter.outputs.run == 'true'
        run: npm ci

      - name: Verify preinstalled Chromium (no download)
        if: steps.filter.outputs.run == 'true'
        # No-op inside the pinned Playwright image: Chromium + OS deps are already
        # baked in, so this just validates the browser is present. --with-deps is
        # dropped so no apt/network work runs. The timeout is a guard: if a version
        # drift ever re-triggers a runtime download, fail fast (well under 3 min)
        # instead of hanging ~8 min like the old --with-deps step did.
        timeout-minutes: 2
        run: npx playwright install chromium

      - name: Build app
        if: steps.filter.outputs.run == 'true'
        run: npm run build

      - name: Run real-browser gate
        if: steps.filter.outputs.run == 'true'
        run: npm run test:gate
