# Publish the homepad image to GitHub Container Registry — on GITHUB runners.
#
# How code reaches this workflow: the canonical repo lives on Gitea
# (Code/homepad); a Gitea push mirror (sync_on_commit) pushes every ref to
# github.com/finish06/homepad, so a merge to main on Gitea lands here within
# moments and triggers this build.
#
# Test-dedup contract (docs/cicd.md): NO tests here. Anything on main already
# passed the PR gates + QA pool on Gitea — this is purely a second publish
# target, on GitHub's infrastructure so a ghcr push never consumes the homelab
# runner and needs no PAT: the workflow's own GITHUB_TOKEN (packages: write)
# authenticates to ghcr.io.
#
# Tags mirror the internal registry's scheme (:<7-char sha> + :latest) so the
# same tag names exist in both registries for any given release. GIT_SHA is
# threaded as a build-arg so the footer badge and /version.json carry the real
# sha (#157) exactly like the Kaniko builds do.
#
# WHO CONSUMES THIS IMAGE: nothing in the homelab, deliberately.
#
# Audited 2026-09-29 during a fleet CI review. `Code/homelab` references
# `ghcr.io/finish06/*` only for `rx-dag` and `rsync-viewer`, and those are the
# only finish06 ghcr images any running pod in the cluster pulls. No homepad
# manifest, in any namespace, points at ghcr. NOT checked: the gethomepad demo,
# which runs on Cloud Run outside the cluster — so "unconsumed" is established
# for the homelab and unverified beyond it.
#
# It is kept ON PURPOSE as a second, public publish target: the GitHub mirror is
# public, so this is the registry anyone outside the homelab could pull homepad
# from, and it doubles as an off-cluster copy of every main build. Caleb's call,
# 2026-09-29, after the audit raised it as apparently unowned.
#
# So: a zero-consumer audit result is NOT a reason to retire this. If you are
# here because nothing seems to use it, that is the expected state.
name: ghcr publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-pushed release

jobs:
  build-push:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short sha tag
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/finish06/homepad:latest
            ghcr.io/finish06/homepad:${{ steps.sha.outputs.short }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
