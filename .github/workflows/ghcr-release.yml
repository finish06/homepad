# Publish the homepad and homepad-api images to GitHub Container Registry — on
# GITHUB runners. One vX.Y.Z tag pushes both at :X.Y.Z (SPEC-monorepo-api
# AC-003, AC-006); the API job was homepad-api's own ghcr-release.yml before the
# API moved into api/.
#
# How code reaches this workflow: the canonical repo lives on Gitea
# (Code/homepad); a Gitea push mirror (sync_on_commit) pushes every ref to
# github.com/finish06/homepad, so a merge to main on Gitea lands here within
# moments and triggers this build.
#
# Test-dedup contract (docs/cicd.md): NO tests here. Anything on main already
# passed the PR gates + QA pool on Gitea — this is purely a second publish
# target, on GitHub's infrastructure so a ghcr push never consumes the homelab
# runner and needs no PAT: the workflow's own GITHUB_TOKEN (packages: write)
# authenticates to ghcr.io.
#
# Tags mirror the internal registry's scheme (:<7-char sha> + :latest), plus
# version tags from v* release tags (see the Image tags step). GIT_SHA is
# threaded as a build-arg so the footer badge and /version.json carry the real
# sha (#157) exactly like the Kaniko builds do.
#
# WHO CONSUMES THIS IMAGE: nothing in the homelab, deliberately.
#
# Audited 2026-09-29 during a fleet CI review. `Code/homelab` references
# `ghcr.io/finish06/*` only for `rx-dag` and `rsync-viewer`, and those are the
# only finish06 ghcr images any running pod in the cluster pulls. No homepad
# manifest, in any namespace, points at ghcr. NOT checked: the gethomepad demo,
# which runs on Cloud Run outside the cluster — so "unconsumed" is established
# for the homelab and unverified beyond it.
#
# It is kept ON PURPOSE as a second, public publish target: the GitHub mirror is
# public, so this is the registry anyone outside the homelab could pull homepad
# from, and it doubles as an off-cluster copy of every main build. Caleb's call,
# 2026-09-29, after the audit raised it as apparently unowned.
#
# So: a zero-consumer audit result is NOT a reason to retire this. If you are
# here because nothing seems to use it, that is the expected state.
name: ghcr publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-pushed release

jobs:
  build-push:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: main → :<sha>, :latest (unchanged); a vX.Y.Z tag → :X.Y.Z, :X.Y,
      # :X, :<sha>. Version tags are what the public quickstart pins. :latest
      # keeps tracking main because something outside the homelab may already
      # pull it (the 2026-09-29 audit couldn't rule out the demo).
      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/finish06/homepad
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=homepad
            org.opencontainers.image.description=Self-hosted household dashboard for the homelab
            org.opencontainers.image.url=https://gethomepad.dev

      # linux/arm64 too, for Raspberry Pi and other ARM homelab hosts (built under
      # QEMU; the Dockerfile is unchanged, so the internal Kaniko build is untouched).
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # homepad-api, from api/. It is the public image people outside the homelab
  # install: the quickstart compose pulls ghcr.io/finish06/homepad-api:<version>
  # next to ghcr.io/finish06/homepad:<version>. Same tag scheme as the web.
  build-push-api:
    name: Build & push homepad-api to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/finish06/homepad-api
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=homepad-api
            org.opencontainers.image.description=Go API for Homepad, the self-hosted household dashboard
            org.opencontainers.image.url=https://gethomepad.dev

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile writes VERSION into backups as homepadVersion. A tag
          # build gets the semver version without the leading v (e.g. 18.0.0).
          # A main build gets dev-<commit sha>; metadata-action's version output
          # would be "latest" there, which names no build.
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || format('dev-{0}', github.sha) }}
          # A separate cache scope, so the two images don't evict each other.
          cache-from: type=gha,scope=homepad-api
          cache-to: type=gha,mode=max,scope=homepad-api
