<!DOCTYPE html>
<html lang="en" data-mode="dark" data-theme="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homepad</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
    --r-panel:24px; --r-tile:18px; --r-ico:12px;
  }

  /* ===== accent themes (accent + dark background tint) ===== */
  [data-theme="blue"]  {--accent:#8FB8FF;--accent-2:#5A9BFF;--accent-3:#2E63E0;--on-accent:#fff;--amb:rgba(58,108,224,.26);--bg-1:#0d1526;--bg-2:#080b14}
  [data-theme="teal"]  {--accent:#7FE3DC;--accent-2:#2BC4BC;--accent-3:#0E938D;--on-accent:#04140F;--amb:rgba(30,190,180,.22);--bg-1:#08201f;--bg-2:#061413}
  [data-theme="green"] {--accent:#63E6A6;--accent-2:#22C67D;--accent-3:#0E9A5C;--on-accent:#05130D;--amb:rgba(28,176,118,.22);--bg-1:#0a1b15;--bg-2:#07110d}
  [data-theme="yellow"]{--accent:#FFDC7A;--accent-2:#FFC72E;--accent-3:#C79310;--on-accent:#241B00;--amb:rgba(220,176,44,.20);--bg-1:#181407;--bg-2:#100c05}
  [data-theme="orange"]{--accent:#FFC08F;--accent-2:#FF8A3D;--accent-3:#E06A12;--on-accent:#2A1400;--amb:rgba(230,120,48,.22);--bg-1:#1b1209;--bg-2:#120b06}
  [data-theme="red"]   {--accent:#FF9A9C;--accent-2:#FF5A5C;--accent-3:#D63437;--on-accent:#fff;--amb:rgba(220,74,84,.22);--bg-1:#1b0f13;--bg-2:#120a0c}
  [data-theme="pink"]  {--accent:#FF9EC8;--accent-2:#FF5CA0;--accent-3:#D63A7C;--on-accent:#fff;--amb:rgba(236,80,150,.22);--bg-1:#210e1a;--bg-2:#150a11}
  [data-theme="purple"]{--accent:#C4B4FF;--accent-2:#9B7CFF;--accent-3:#6A4FCF;--on-accent:#fff;--amb:rgba(150,110,246,.24);--bg-1:#150e26;--bg-2:#0d0916}

  /* light-mode background bases (accent stays; base + wash go pale) */
  [data-mode="light"][data-theme="blue"]  {--bg-1:#eef3fb;--bg-2:#e2eaf6;--amb:rgba(58,108,224,.16)}
  [data-mode="light"][data-theme="teal"]  {--bg-1:#e9f6f6;--bg-2:#d9eeee;--amb:rgba(30,190,180,.15)}
  [data-mode="light"][data-theme="green"] {--bg-1:#ecf6f1;--bg-2:#deeee6;--amb:rgba(28,176,118,.15)}
  [data-mode="light"][data-theme="yellow"]{--bg-1:#f9f4e3;--bg-2:#f2ebd1;--amb:rgba(210,168,40,.16)}
  [data-mode="light"][data-theme="orange"]{--bg-1:#fbf1e8;--bg-2:#f5e5d6;--amb:rgba(230,120,48,.15)}
  [data-mode="light"][data-theme="red"]   {--bg-1:#fbeef0;--bg-2:#f5e1e5;--amb:rgba(214,58,62,.15)}
  [data-mode="light"][data-theme="pink"]  {--bg-1:#fbeef5;--bg-2:#f5dfeb;--amb:rgba(236,80,150,.15)}
  [data-mode="light"][data-theme="purple"]{--bg-1:#f2eefb;--bg-2:#e7dff6;--amb:rgba(150,110,246,.16)}

  /* ===== dark mode surfaces (default) ===== */
  [data-mode="dark"]{
    --txt:rgba(255,255,255,.93);--muted:rgba(255,255,255,.54);--faint:rgba(255,255,255,.36);
    --up:#43D18E;--down:#F0686B;--idle:rgba(255,255,255,.4);
    --glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.05);
    --brd:rgba(255,255,255,.09);--hi:rgba(255,255,255,.14);--hi2:rgba(255,255,255,.10);
    --shadow:rgba(0,0,0,.34);--shadow-tile:rgba(0,0,0,.28);
    --hover:rgba(255,255,255,.085);--rule:rgba(255,255,255,.14);
    --kbdbrd:rgba(255,255,255,.16);--btnhover:rgba(255,255,255,.12);--sep:#0b0d16;
    --tick-idle:rgba(255,255,255,.14);--legend-idle:rgba(255,255,255,.18);
    --tile:rgba(255,255,255,.055);--tilebrd:rgba(255,255,255,.08);--tilehi:rgba(255,255,255,.12);
    --ico-hi:rgba(255,255,255,.14);--chip:rgba(255,255,255,.06);--chipbrd:rgba(255,255,255,.08);
    --focus-fill:rgba(255,255,255,.09);
  }
  /* ===== light mode surfaces ===== */
  [data-mode="light"]{
    --txt:rgba(20,23,30,.92);--muted:rgba(28,32,42,.62);--faint:rgba(28,32,42,.44);
    --up:#0E9E5C;--down:#D23A3D;--idle:rgba(22,25,32,.34);
    --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.5);
    --brd:rgba(255,255,255,.65);--hi:rgba(255,255,255,.9);--hi2:rgba(255,255,255,.8);
    --shadow:rgba(30,42,72,.14);--shadow-tile:rgba(30,42,72,.10);
    --hover:rgba(255,255,255,.78);--rule:rgba(24,30,48,.14);
    --kbdbrd:rgba(24,30,48,.2);--btnhover:rgba(255,255,255,.72);--sep:#ffffff;
    --tick-idle:rgba(24,30,48,.16);--legend-idle:rgba(24,30,48,.22);
    --tile:rgba(255,255,255,.52);--tilebrd:rgba(255,255,255,.62);--tilehi:rgba(255,255,255,.85);
    --ico-hi:rgba(255,255,255,.5);--chip:rgba(255,255,255,.55);--chipbrd:rgba(255,255,255,.6);
    --focus-fill:rgba(255,255,255,.75);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{font-family:var(--sans);color:var(--txt);background:var(--bg-2);min-height:100vh;
    padding:0 clamp(16px,4vw,44px) 72px;overflow-x:hidden;transition:color .4s}
  .wrap{max-width:1440px;margin:0 auto;position:relative;z-index:1}

  /* static ambient field */
  .field{position:fixed;inset:0;z-index:0;transition:background .5s ease}
  [data-mode="dark"] .field{background:
    radial-gradient(110% 85% at 50% -22%, var(--amb), transparent 58%),
    radial-gradient(95% 75% at 100% 118%, var(--amb), transparent 55%),
    linear-gradient(180deg,var(--bg-1),var(--bg-2))}
  [data-mode="light"] .field{background:
    radial-gradient(115% 85% at 50% -22%, var(--amb), transparent 62%),
    radial-gradient(95% 75% at 100% 118%, var(--amb), transparent 60%),
    linear-gradient(180deg,var(--bg-1),var(--bg-2))}

  /* glass */
  .glass{position:relative;background:var(--glass);
    -webkit-backdrop-filter:blur(30px) saturate(112%);backdrop-filter:blur(30px) saturate(112%);
    border:1px solid var(--brd);box-shadow:0 10px 34px var(--shadow),inset 0 1px 0 var(--hi)}
  .ctl{background:var(--glass2);border:1px solid var(--brd);
    -webkit-backdrop-filter:blur(20px) saturate(112%);backdrop-filter:blur(20px) saturate(112%);
    box-shadow:inset 0 1px 0 var(--hi2)}

  /* top bar */
  .topbar{display:flex;align-items:center;gap:12px;border-radius:999px;padding:11px 16px;margin:22px 0 26px}
  .brand{display:flex;align-items:center;gap:10px;padding-left:6px}
  .brand .mk{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent-3));
    box-shadow:0 0 0 3px var(--brd);transition:background .4s}
  .brand h1{font-size:19px;font-weight:600;letter-spacing:-.02em}
  .brand h1 span{background:linear-gradient(120deg,var(--accent-2),var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .spacer{flex:1}
  .theme{display:flex;align-items:center;gap:8px;border-radius:999px;padding:8px 11px}
  .sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent;padding:0;background:var(--c);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s,box-shadow .15s}
  .sw:hover{transform:scale(1.16)}
  .sw.on{box-shadow:0 0 0 2px var(--sep),0 0 0 4px var(--c)}
  .sw:focus-visible{outline:2px solid var(--accent-3);outline-offset:2px}
  .search{display:flex;align-items:center;gap:9px;min-width:200px;border-radius:999px;padding:9px 15px;color:var(--faint);
    font-size:13.5px;cursor:text;transition:border-color .2s,background .2s}
  .search:focus-within{border-color:var(--accent-3);background:var(--focus-fill)}
  .search input{background:none;border:0;outline:0;color:var(--txt);font-family:var(--sans);font-size:13.5px;width:100%}
  .search input::placeholder{color:var(--faint)}
  .kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--kbdbrd);border-radius:6px;padding:1px 5px}
  .iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:.2s}
  .iconbtn:hover{color:var(--txt);background:var(--btnhover)}
  [data-mode="dark"] .i-sun{display:none}[data-mode="light"] .i-moon{display:none}
  .avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--on-accent);font-weight:600;font-size:15px;
    background:linear-gradient(135deg,var(--accent-2),var(--accent-3));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 10px var(--shadow);transition:background .4s,color .4s}

  /* health header */
  .health{border-radius:var(--r-panel);padding:26px 30px;margin-bottom:34px;
    display:grid;grid-template-columns:auto 1fr;gap:28px 40px;align-items:center}
  .verdict{min-width:236px}
  .status-led{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;color:var(--up);margin-bottom:13px}
  .status-led .led{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
  .verdict h2{font-size:29px;font-weight:600;letter-spacing:-.03em;line-height:1.04}
  .verdict .sub{color:var(--muted);font-size:13.5px;margin-top:8px}
  .verdict .sub b{color:var(--txt);font-weight:600}
  .metrics{display:flex;flex-direction:column;gap:18px}
  .chips{display:flex;gap:11px;flex-wrap:wrap}
  .chip{display:flex;align-items:baseline;gap:9px;border-radius:14px;padding:12px 17px;
    background:var(--chip);border:1px solid var(--chipbrd);box-shadow:inset 0 1px 0 var(--hi2)}
  .chip .n{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .chip .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
  .chip.up .n{color:var(--up)} .chip.idle .n{color:var(--txt)} .chip.down .n{color:var(--faint)}
  .meter{display:flex;flex-direction:column;gap:10px}
  .ticks{display:flex;gap:3px;height:26px}
  .tick{flex:1 1 0;border-radius:3px;min-width:2px}
  .tick.up{background:var(--up)} .tick.idle{background:var(--tick-idle)} .tick.down{background:var(--down)}
  .legend{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .legend i.i-idle{background:var(--legend-idle)}
  .legend .updated{margin-left:auto;color:var(--faint)}

  /* sections */
  .board{display:flex;flex-direction:column;gap:28px}
  .section-head{display:flex;align-items:center;gap:16px;margin:2px 4px 15px}
  .section-head .name{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .section-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
  .section-head .count{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .section-head .count .swatch{width:8px;height:8px;border-radius:50%}
  .grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(162px,1fr))}
  .tile{border-radius:var(--r-tile);padding:16px 16px 14px;display:flex;flex-direction:column;gap:15px;position:relative;
    text-decoration:none;color:inherit;cursor:pointer;overflow:hidden;
    -webkit-backdrop-filter:blur(20px) saturate(112%);backdrop-filter:blur(20px) saturate(112%);
    background:var(--tile);border:1px solid var(--tilebrd);
    box-shadow:0 6px 20px var(--shadow-tile),inset 0 1px 0 var(--tilehi);
    transition:transform .18s ease,background .18s,border-color .18s;
    opacity:0;transform:translateY(6px);animation:rise .45s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .tile:hover{transform:translateY(-2px);background:var(--hover);border-color:var(--edge,var(--tilebrd))}
  .tile:focus-visible{outline:2px solid var(--accent-3);outline-offset:3px}
  .tile.idle{opacity:.52;animation:rise-i .45s ease forwards}
  @keyframes rise-i{to{opacity:.52;transform:none}}
  .tile.idle:hover{opacity:.88}
  .tile.down{border-color:color-mix(in srgb,var(--down) 45%,transparent);background:color-mix(in srgb,var(--down) 10%,var(--tile))}
  .tile.down::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--down)}
  .tile .top{display:flex;align-items:flex-start;justify-content:space-between}
  .ico{width:44px;height:44px;border-radius:var(--r-ico);display:grid;place-items:center;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.03em;
    color:var(--tint);background:var(--tint-bg);border:1px solid var(--tint-br);box-shadow:inset 0 1px 0 var(--ico-hi)}
  [data-mode="light"] .ico{color:#fff;background:var(--tint-solid);border-color:rgba(255,255,255,.4);text-shadow:0 1px 1px rgba(0,0,0,.15)}
  .ico svg{width:21px;height:21px}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:3px;flex:0 0 auto}
  .dot.up{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 16%,transparent)}
  .dot.idle{background:transparent;border:1.5px dashed var(--idle)}
  .dot.down{background:var(--down);box-shadow:0 0 0 3px color-mix(in srgb,var(--down) 18%,transparent);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .tile .name{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  .tile .meta{font-family:var(--mono);font-size:11px;margin-top:5px;color:var(--muted)}
  .tile.up .meta{color:var(--up)} .tile.idle .meta{color:var(--faint)} .tile.down .meta{color:var(--down)}
  .tile .meta::before{content:"● ";font-size:8px;vertical-align:middle}
  .tile.idle .meta::before{content:"○ "}

  @media (max-width:820px){.topbar{flex-wrap:wrap}.search{min-width:0;flex:1 1 100%;order:5}}
  @media (max-width:720px){
    .health{grid-template-columns:1fr;gap:22px;padding:22px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(144px,1fr))}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
    .tile{opacity:1;transform:none}.tile.idle{opacity:.52}}
</style>
</head>
<body>
<div class="field"></div>

<div class="wrap">
  <header class="topbar glass">
    <div class="brand"><span class="mk"></span><h1>home<span>pad</span></h1></div>
    <div class="spacer"></div>
    <div class="theme ctl" role="radiogroup" aria-label="Primary color">
      <button class="sw" data-theme="blue"   style="--c:#4A90FF" role="radio" aria-label="Blue"></button>
      <button class="sw" data-theme="teal"   style="--c:#22C4BC" role="radio" aria-label="Teal"></button>
      <button class="sw" data-theme="green"  style="--c:#22C67D" role="radio" aria-label="Green"></button>
      <button class="sw" data-theme="yellow" style="--c:#FFC72E" role="radio" aria-label="Yellow"></button>
      <button class="sw" data-theme="orange" style="--c:#FF8A3D" role="radio" aria-label="Orange"></button>
      <button class="sw" data-theme="red"    style="--c:#FF5A5C" role="radio" aria-label="Red"></button>
      <button class="sw" data-theme="pink"   style="--c:#FF5CA0" role="radio" aria-label="Pink"></button>
      <button class="sw" data-theme="purple" style="--c:#9B7CFF" role="radio" aria-label="Purple"></button>
    </div>
    <button class="iconbtn ctl" id="mode" aria-label="Toggle light or dark mode">
      <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <label class="search ctl">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Search services…" aria-label="Search services">
      <span class="kbd">⌘K</span>
    </label>
    <div class="avatar">C</div>
  </header>

  <section class="health glass" aria-label="System health">
    <div class="verdict">
      <div class="status-led"><span class="led"></span>operational</div>
      <h2>All systems operational</h2>
      <p class="sub"><b>47</b> services across 5 groups · <b>39</b> monitored</p>
    </div>
    <div class="metrics">
      <div class="chips">
        <div class="chip up"><span class="n">39</span><span class="l">online</span></div>
        <div class="chip idle"><span class="n">8</span><span class="l">not monitored</span></div>
        <div class="chip down"><span class="n">0</span><span class="l">offline</span></div>
      </div>
      <div class="meter">
        <div class="ticks" id="ticks" aria-hidden="true"></div>
        <div class="legend">
          <span><i style="background:var(--up)"></i>online</span>
          <span><i class="i-idle"></i>idle</span>
          <span><i style="background:var(--down)"></i>offline</span>
          <span class="updated">updated 9s ago</span>
        </div>
      </div>
    </div>
  </section>

  <div class="board" id="board"></div>
</div>

<script>
const TERM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>';
const STAR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 16.9 5.8 20.6l1.6-6.7L2.2 8.9l6.9-.6z"/></svg>';
const CATS={
  develop:{name:'Develop', tint:'#C6BBFF', bg:'rgba(139,124,246,.16)', br:'rgba(183,169,255,.32)', solid:'#7C6CF0'},
  kids:   {name:'Kids',    tint:'#EDC891', bg:'rgba(224,164,88,.16)',  br:'rgba(240,200,140,.32)', solid:'#D89A46'},
  external:{name:'External',tint:'#93E0EE', bg:'rgba(76,196,217,.16)',  br:'rgba(140,220,235,.32)', solid:'#2FA9C0'},
  friends:{name:'Friends', tint:'#BCC6DD', bg:'rgba(124,137,166,.16)', br:'rgba(180,190,215,.30)', solid:'#6E7B96'},
  media:  {name:'Media',   tint:'#86DDBC', bg:'rgba(72,176,140,.16)',  br:'rgba(140,225,195,.32)', solid:'#34A883'},
};
const SERVICES=[
  {c:'develop',n:'Fleet Feed',m:'FF',s:'up'},{c:'develop',n:'Gitea',m:'Gt',s:'up'},{c:'develop',n:'Dockerhub',m:'Dk',s:'up'},
  {c:'kids',n:'Disney Trivia',ic:STAR,s:'idle'},{c:'kids',n:'Kids Words',m:'KW',s:'idle'},{c:'kids',n:'t3',m:'t3',s:'idle'},
  {c:'external',n:'Pangolin API',m:'Pn',s:'up'},{c:'external',n:'PocketID',m:'PI',s:'up'},
  {c:'friends',n:'Ada',ic:TERM,s:'idle'},{c:'friends',n:'Gracie',ic:TERM,s:'idle'},{c:'friends',n:'Murph',ic:TERM,s:'idle'},{c:'friends',n:'Stitch',ic:TERM,s:'idle'},{c:'friends',n:'Walt',ic:TERM,s:'idle'},
  {c:'media',n:'airdcpp',m:'ad',s:'up'},{c:'media',n:'autobrr',m:'ab',s:'up'},{c:'media',n:'bazarr',m:'bz',s:'up'},{c:'media',n:'boxarr',m:'bx',s:'up'},{c:'media',n:'lidarr',m:'li',s:'up'},{c:'media',n:'mylar',m:'my',s:'up'},{c:'media',n:'pinchflat',m:'pf',s:'up'},{c:'media',n:'prowlarr',m:'pr',s:'up'},{c:'media',n:'qBittorrent',m:'qb',s:'up'},{c:'media',n:'radarr',m:'rd',s:'up'},{c:'media',n:'readarr',m:'re',s:'up'},{c:'media',n:'sonarr',m:'so',s:'up'},
];
const META={up:'online',idle:'not monitored',down:'offline'};

const FLEET={up:39,idle:8,down:0};
const ticks=document.getElementById('ticks');
[...Array(FLEET.down).fill('down'),...Array(FLEET.up).fill('up'),...Array(FLEET.idle).fill('idle')].forEach(s=>{
  const t=document.createElement('div');t.className='tick '+s;ticks.appendChild(t);
});

const board=document.getElementById('board');
let delay=0;
['develop','kids','external','friends','media'].forEach(key=>{
  const cat=CATS[key],items=SERVICES.filter(s=>s.c===key);
  const up=items.filter(s=>s.s==='up').length,down=items.filter(s=>s.s==='down').length;
  const sw=down?'var(--down)':(up?'var(--up)':'var(--idle)');
  const label=down?(down+' offline'):(up?up+'/'+items.length+' up':items.length+' idle');
  const sec=document.createElement('section');
  sec.innerHTML=`<div class="section-head"><span class="name">${cat.name}</span><span class="rule"></span><span class="count"><span class="swatch" style="background:${sw}"></span>${label}</span></div><div class="grid"></div>`;
  const grid=sec.querySelector('.grid');
  items.forEach(s=>{
    const a=document.createElement('a');a.href='#';a.className='tile '+s.s;
    a.style.setProperty('--tint',cat.tint);a.style.setProperty('--tint-bg',cat.bg);a.style.setProperty('--tint-br',cat.br);
    a.style.setProperty('--tint-solid',cat.solid);a.style.setProperty('--edge',cat.br);
    a.style.animationDelay=delay+'ms';delay+=18;
    a.innerHTML=`<div class="top"><div class="ico">${s.ic||s.m||''}</div><span class="dot ${s.s}" title="${META[s.s]}"></span></div><div><div class="name">${s.n}</div><div class="meta">${META[s.s]}</div></div>`;
    grid.appendChild(a);
  });
  board.appendChild(sec);
});

const root=document.documentElement;
// color picker
const swatches=document.querySelectorAll('.sw');
function setTheme(t){root.setAttribute('data-theme',t);
  swatches.forEach(s=>{const on=s.dataset.theme===t;s.classList.toggle('on',on);s.setAttribute('aria-checked',on)});
  try{localStorage.setItem('homepad-theme',t)}catch(e){}}
swatches.forEach(s=>s.addEventListener('click',()=>setTheme(s.dataset.theme)));
// light / dark
function setMode(m){root.setAttribute('data-mode',m);
  document.getElementById('mode').setAttribute('aria-pressed',m==='light');
  try{localStorage.setItem('homepad-mode',m)}catch(e){}}
document.getElementById('mode').addEventListener('click',()=>{
  setMode(root.getAttribute('data-mode')==='dark'?'light':'dark');
});
let t='blue',m='dark';
try{t=localStorage.getItem('homepad-theme')||'blue';m=localStorage.getItem('homepad-mode')||'dark'}catch(e){}
setTheme(t);setMode(m);
</script>
</body>
</html>
