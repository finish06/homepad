apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homepad-api
    pr: "${PR_NUMBER}"
    app.kubernetes.io/part-of: homepad
    homepad.preview/pr: "${PR_NUMBER}"
  name: homepad-api-pr-${PR_NUMBER}
  namespace: homepad-preview
  annotations:
    homepad.preview/sha: ${PR_SHA}
    homepad.preview/deployed-at: ${DEPLOYED_AT}
    homepad.preview/run: "${PREVIEW_RUN}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepad-api
      pr: "${PR_NUMBER}"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: homepad-api
        pr: "${PR_NUMBER}"
        app.kubernetes.io/part-of: homepad
        homepad.preview/pr: "${PR_NUMBER}"
    spec:
      containers:
      - env:
        - name: PORT
          value: '8080'
        - name: DATABASE_URL
          value: postgres://homepad:homepad@homepad-db-pr-${PR_NUMBER}:5432/homepad?sslmode=disable
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              key: SESSION_SECRET
              name: homepad-api-secrets
        - name: HOMEPAD_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: HOMEPAD_SECRET_KEY
              name: homepad-api-secrets
        - name: HOMEPAD_TRUSTED_PROXIES
          value: 10.42.0.0/16
        - name: OIDC_ENABLED
          value: 'false'
        - name: HOMEPAD_REGISTRATION
          value: open
        image: ${API_IMAGE}
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /live
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        name: api
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 8
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      imagePullSecrets:
      - name: dockerhub-creds
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: homepad-api-pr-${PR_NUMBER}
  namespace: homepad-preview
  labels:
    app: homepad-api
    pr: "${PR_NUMBER}"
    app.kubernetes.io/part-of: homepad
    homepad.preview/pr: "${PR_NUMBER}"
  annotations:
    homepad.preview/sha: ${PR_SHA}
    homepad.preview/deployed-at: ${DEPLOYED_AT}
    homepad.preview/run: "${PREVIEW_RUN}"
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: homepad-api
    pr: "${PR_NUMBER}"
  type: ClusterIP
