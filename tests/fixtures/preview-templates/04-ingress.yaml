apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepad-pr-${PR_NUMBER}
  namespace: homepad-preview
  labels:
    app: homepad
    pr: "${PR_NUMBER}"
    app.kubernetes.io/part-of: homepad
    homepad.preview/pr: "${PR_NUMBER}"
  annotations:
    homepad.preview/sha: ${PR_SHA}
    homepad.preview/deployed-at: ${DEPLOYED_AT}
    homepad.preview/run: "${PREVIEW_RUN}"
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`pr-${PR_NUMBER}.homepad-preview.cluster.example`) && PathPrefix(`/api`)
    priority: 100
    services:
    - name: homepad-api-pr-${PR_NUMBER}
      port: 8080
  - kind: Rule
    match: Host(`pr-${PR_NUMBER}.homepad-preview.cluster.example`)
    priority: 10
    services:
    - name: homepad-web-pr-${PR_NUMBER}
      port: 80
