# Baseline security headers for every response. Kept in a snippet because
# nginx's add_header does NOT cascade into any location that declares its own
# add_header (the child's set replaces the parent's wholesale) — so this file
# is `include`d at server level AND inside each location that adds headers.
# TLS/HSTS terminates at the Pangolin ingress, not here.
#
# Nothing may frame Homepad, not even Homepad (SPEC-iframe-sandbox-optin
# AC-006): an app in the overlay that redirects to a Homepad page gets a
# refusal. The CSP has only frame-ancestors. A fuller CSP needs the inline
# theme anti-flash script in index.html externalized (or hash-listed) first.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
