# Baseline security headers for every response. Kept in a snippet because
# nginx's add_header does NOT cascade into any location that declares its own
# add_header (the child's set replaces the parent's wholesale) — so this file
# is `include`d at server level AND inside each location that adds headers.
# TLS/HSTS terminates at the Pangolin ingress, not here.
#
# Nothing may frame Homepad, not even Homepad (SPEC-iframe-sandbox-optin
# AC-006): an app in the overlay that redirects to a Homepad page gets a
# refusal.
#
# Content-Security-Policy (SPEC-cleanup-18.6.0 §2–§3, #529). The one inline
# script, the theme anti-flash bootstrap in index.html, is allowed by its
# sha256 hash: edit that script and the hash must change too
# (tests/infra/frame-headers.test.ts fails until it does). Icons may come from
# any http/https origin or a data: URL, and an Inline overlay tile may frame
# any http/https app. Everything else is same-origin. The same line is
# repeated in compose.yaml, deploy/compose/nginx.conf and the homelab
# ConfigMap (spec §7); the infra test keeps the copies identical.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2WIx1PmtuXkeJsDIXK1WvlMpt2A4NyctD0cVBEfTl/M='; style-src 'self'; img-src 'self' data: http: https:; font-src 'self'; connect-src 'self'; frame-src http: https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
