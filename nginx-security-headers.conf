# Baseline security headers for every response. Kept in a snippet because
# nginx's add_header does NOT cascade into any location that declares its own
# add_header (the child's set replaces the parent's wholesale) — so this file
# is `include`d at server level AND inside each location that adds headers.
# TLS/HSTS terminates at the Pangolin ingress, not here.
#
# No Content-Security-Policy yet: index.html carries an inline theme anti-flash
# script, so a useful CSP needs that script externalized (or hash-listed) first.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
