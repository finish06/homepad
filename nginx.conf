server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every unknown path returns index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The homepad-api lives at /api/* in prod — Pangolin Ingress routes it.
  # nginx only serves static here; do NOT proxy /api itself.

  # Long-cache hashed assets, no-cache the index.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # nginx's default mime.types has no .webmanifest entry, so it falls back to
  # application/octet-stream — which blocks PWA install. Serve the correct type.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }
}
