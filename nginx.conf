server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every unknown path returns index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The homepad-api lives at /api/* in prod — Pangolin Ingress routes it.
  # nginx only serves static here; do NOT proxy /api itself.

  # Long-cache hashed assets, no-cache the index.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # nginx's bundled mime.types (1.27.x) has no .webmanifest entry, so the file
  # otherwise falls back to the http-level `application/octet-stream`, which
  # blocks PWA install (issue #18 / #69). `types { }` clears the inherited mime
  # map for THIS location only — so no stray extension mapping can win — then
  # default_type supplies the manifest type. Verified with `curl -I` against a
  # real nginx serving this file (not jsdom). The Dockerfile asserts this line
  # is present in the built image so a stale build-cache layer can't ship the
  # old conf again (the failure mode that left #18 unfixed on staging).
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
  }
}
