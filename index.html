<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>homepad</title>
    <!-- v3 anti-flash: set the dark class before the bundle paints so a
         dark-preferring user never flashes a light surface. Mirrors
         resolveBootTheme() in src/theme.tsx — uses the localStorage cache (last
         resolved theme), falling back to the OS preference. ThemeProvider makes
         the server themePref authoritative once /api/me resolves. -->
    <script>
      (function () {
        try {
          var cache = localStorage.getItem('homepad.theme');
          var dark =
            cache === 'dark' ||
            (cache !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
